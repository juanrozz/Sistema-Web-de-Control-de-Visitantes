<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingreso al Sistema - Portería</title>
</head>
<body>
    <h1>Control de Acceso</h1>
    <p>Ingrese sus credenciales asignadas por el administrador.</p>

    {% if form.errors %}
        <p style="color: red;">Usuario o contraseña incorrectos. Intente de nuevo.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label for="id_username">Usuario:</label><br>
            <input type="text" name="username" id="id_username" required autofocus>
        </p>
        <p>
            <label for="id_password">Contraseña:</label><br>
            <input type="password" name="password" id="id_password" required>
        </p>
        <button type="submit">Iniciar Sesión</button>
    </form>
</body>
</html>
